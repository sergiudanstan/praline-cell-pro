name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; no job here needs to write anything.
permissions:
  contents: read

jobs:
  test:
    name: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install test dependencies from the lockfile
        run: npm ci --ignore-scripts
      - name: Committed index.html must equal a fresh build of src/
        run: |
          node tools/build.mjs
          git diff --exit-code -- index.html || { echo "index.html is stale: run 'node tools/build.mjs' and commit it" >&2; exit 1; }
      - name: Cell logic checks (schedule, recipe, mutexes, IK, joint limits, clearance)
        run: npm test
      - name: Perturbed run must fail (proves the checks can fail)
        # --perturb removes the nest interlock; the suite must then exit with
        # status 1 (failed checks). Any other status, including 0 and 2
        # (perturbation target not found), fails this step.
        run: |
          set +e
          node tests/run.mjs --perturb > /dev/null
          status=$?
          [ "$status" -eq 1 ] || { echo "expected exit 1 from --perturb, got $status" >&2; exit 1; }
      - name: Load index.html in headless Chrome, fail on any page error
        # Chrome is preinstalled on the runner image; playwright-core drives it,
        # so no browser download is needed.
        run: npm run test:smoke

  audit:
    name: security audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install audit tooling (hash-pinned)
        run: python -m pip install --require-hashes -r .github/requirements-ci.lock
      - name: Known vulnerabilities in the CI toolchain
        run: pip-audit --strict --no-deps -r .github/requirements-ci.lock --progress-spinner off
      - name: Known vulnerabilities in npm dependencies
        run: npm audit --audit-level=low
      - name: Audit the workflows themselves
        run: zizmor --format plain .github/workflows/
